name: Bug
description: Something isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — Critical / blocking
        - P1 — High / this sprint
        - P2 — Normal / backlog
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Estimated fix effort
      options:
        - "XS — 1-2 hours"
        - "S — 3-4 hours"
        - "M — 6-10 hours"
        - "L — 12-20 hours"
        - "XL — 24+ hours"
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimate (hours)
      placeholder: "2"
    validations:
      required: true
