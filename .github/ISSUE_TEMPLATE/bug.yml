name: Bug
description: Manual bug entry compatible with AI Task Manager
title: '🐞 [BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Fill in the planning fields below. AI Task Manager will create the hidden
        field database and timing-log comment the first time an agent picks up
        this issue with `/task #<issue-number>`.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know this fix is done?
      value: |
        - [ ] _TBD — define acceptance criteria at Refine._

    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Critical / blocking
        - P1 - High / this sprint
        - P2 - Normal / backlog
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Estimated fix effort
      options:
        - 'XS - 1-2 hours'
        - 'S - 3-4 hours'
        - 'M - 6-10 hours'
        - 'L - 12-20 hours'
        - 'XL - 24+ hours'
    validations:
      required: false

  - type: input
    id: estimate
    attributes:
      label: Estimate
      description: Mid-point fix estimate in hours, for example 2 or 2h.
      placeholder: '2'
    validations:
      required: false

  - type: input
    id: rank
    attributes:
      label: Rank
      description: Optional fan-out/order number used by AITM orchestration.
      placeholder: '1'
    validations:
      required: false
