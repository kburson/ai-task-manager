name: Task
description: Manual task entry compatible with AI Task Manager
title: '[Task] '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Fill in the planning fields below. AI Task Manager will create the hidden
        field database and timing-log comment the first time an agent picks up
        this issue with `/task #<issue-number>`.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know this is done?
      value: |
        - [ ] _TBD — define acceptance criteria at Plan stage._

    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Critical / blocking
        - P1 - High / this sprint
        - P2 - Normal / backlog
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Estimated effort
      options:
        - 'XS - 1-2 hours'
        - 'S - 3-4 hours'
        - 'M - 6-10 hours'
        - 'L - 12-20 hours'
        - 'XL - 24+ hours'
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimate
      description: Mid-point estimate in hours, for example 4 or 4h.
      placeholder: '4'
    validations:
      required: true

  - type: input
    id: rank
    attributes:
      label: Rank
      description: Optional fan-out/order number used by AITM orchestration.
      placeholder: '1'
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Optional issue numbers or work items that should complete first.
      placeholder: '#12, auth setup, database migration'
    validations:
      required: false
