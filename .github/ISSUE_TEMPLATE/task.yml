name: Task
description: A unit of work tracked by the AI task manager
title: "[Task] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Fill in the sections below. The AI assistant will track time and context words
        for this issue automatically via the `/task` skill.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know this is done?
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — Critical / blocking
        - P1 — High / this sprint
        - P2 — Normal / backlog
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Estimated effort
      options:
        - "XS — 1-2 hours"
        - "S — 3-4 hours"
        - "M — 6-10 hours"
        - "L — 12-20 hours"
        - "XL — 24+ hours"
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimate (hours)
      description: Mid-point estimate in hours (used for ROI reporting)
      placeholder: "4"
    validations:
      required: true
