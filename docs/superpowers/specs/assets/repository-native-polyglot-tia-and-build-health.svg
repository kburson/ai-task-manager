<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
  <title id="title">Repository-native polyglot test impact analysis and build-health architecture</title>
  <desc id="description">Architecture diagram showing provider selection, CI execution, metrics and evidence flow, the orphan aitm/tia-data authority branch, project-health gating, and a repair lease.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0369a1" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7e22ce" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#047857" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0.4px; }
      .heading { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; filter: url(#shadow); }
      .core { fill: #f1f5f9; stroke: #334155; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .provider { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 9; }
      .observed { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; rx: 10; }
      .inferred { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 1.5; rx: 10; }
      .authority { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.7; rx: 10; }
      .health { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; rx: 10; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 1.7; rx: 10; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; rx: 16; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #0369a1; stroke-width: 2; marker-end: url(#arrow-blue); }
      .flow-purple { fill: none; stroke: #7e22ce; stroke-width: 2; marker-end: url(#arrow-purple); }
      .flow-red { fill: none; stroke: #b91c1c; stroke-width: 2.2; marker-end: url(#arrow-red); }
      .flow-green { fill: none; stroke: #047857; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#ffffff" />
  <text x="60" y="48" class="title">Repository-Native Polyglot TIA and Build Health</text>
  <text x="60" y="76" class="subtitle">Affected-only pull requests, complete scheduled validation, Git-native evidence, and fail-closed repair governance</text>

  <rect x="45" y="105" width="510" height="815" class="group" />
  <text x="70" y="138" class="section">1 · PLATFORM-NEUTRAL TIA ENGINE</text>

  <rect x="75" y="165" width="205" height="78" class="box" />
  <text x="177" y="192" text-anchor="middle" class="heading">Candidate change</text>
  <text x="177" y="215" text-anchor="middle" class="body">PR, merge group, or local branch</text>
  <text x="177" y="234" text-anchor="middle" class="small">exact candidate + target SHAs</text>

  <rect x="320" y="165" width="205" height="78" class="green" />
  <text x="422" y="192" text-anchor="middle" class="heading">Complete validation</text>
  <text x="422" y="215" text-anchor="middle" class="body">nightly + release candidate</text>
  <text x="422" y="234" text-anchor="middle" class="small">every configured automation lane</text>

  <rect x="75" y="280" width="450" height="86" class="core" />
  <text x="300" y="307" text-anchor="middle" class="heading">Change Resolver</text>
  <text x="300" y="331" text-anchor="middle" class="body">merge-base(target, candidate) → rename-aware changed paths</text>
  <text x="300" y="352" text-anchor="middle" class="small">snapshot baseline is compatibility context, never the PR diff base</text>

  <path d="M177 243 L177 264 L230 264 L230 280" class="flow" />
  <path d="M422 243 L422 264 L370 264 L370 280" class="flow" />

  <rect x="75" y="405" width="215" height="94" class="provider" />
  <text x="182" y="432" text-anchor="middle" class="heading">Node / ESM provider</text>
  <text x="182" y="456" text-anchor="middle" class="body">imports · tests · lanes</text>
  <text x="182" y="477" text-anchor="middle" class="small">structured results + stable IDs</text>

  <rect x="310" y="405" width="215" height="94" class="provider" />
  <text x="417" y="432" text-anchor="middle" class="heading">iOS / Swift provider</text>
  <text x="417" y="456" text-anchor="middle" class="body">schemes · plans · SwiftPM</text>
  <text x="417" y="477" text-anchor="middle" class="small">xcresult + simulator dimensions</text>

  <path d="M230 366 L182 405" class="flow" />
  <path d="M370 366 L417 405" class="flow" />

  <rect x="75" y="540" width="450" height="142" class="core" />
  <text x="300" y="570" text-anchor="middle" class="heading">Core Selection Authority</text>
  <text x="300" y="596" text-anchor="middle" class="body">deterministic floor ∪ provider candidates ∪ historical additions</text>
  <rect x="98" y="616" width="190" height="44" class="authority" />
  <text x="193" y="635" text-anchor="middle" class="label">NON-REMOVABLE FLOOR</text>
  <text x="193" y="651" text-anchor="middle" class="small">static · manifest · changed test · safety</text>
  <rect x="310" y="616" width="192" height="44" class="inferred" />
  <text x="406" y="635" text-anchor="middle" class="label">ADDITIVE RANKING</text>
  <text x="406" y="651" text-anchor="middle" class="small">history · risk · budget above floor</text>

  <path d="M182 499 L182 520 L230 520 L230 540" class="flow" />
  <path d="M417 499 L417 520 L370 520 L370 540" class="flow" />

  <rect x="75" y="724" width="210" height="92" class="green" />
  <text x="180" y="752" text-anchor="middle" class="heading">GREEN ordinary PR</text>
  <text x="180" y="776" text-anchor="middle" class="body">run affected set only</text>
  <text x="180" y="797" text-anchor="middle" class="small">upload exact selection receipt</text>

  <rect x="315" y="724" width="210" height="92" class="green" />
  <text x="420" y="752" text-anchor="middle" class="heading">Sanity / release</text>
  <text x="420" y="776" text-anchor="middle" class="body">run complete automation</text>
  <text x="420" y="797" text-anchor="middle" class="small">health + learning backstop</text>

  <path d="M225 682 L180 724" class="flow-green" />
  <path d="M375 682 L420 724" class="flow-green" />

  <rect x="585" y="105" width="455" height="815" class="group" />
  <text x="610" y="138" class="section">2 · THREE EVIDENCE LAYERS</text>

  <rect x="615" y="165" width="395" height="100" class="observed" />
  <text x="812" y="193" text-anchor="middle" class="heading">Layer 1 · Ignored local observations</text>
  <text x="812" y="218" text-anchor="middle" class="body">worktree-specific duration and failure feedback</text>
  <text x="812" y="240" text-anchor="middle" class="small">provisional · deletable · never shared health authority</text>

  <rect x="615" y="305" width="395" height="118" class="observed" />
  <text x="812" y="333" text-anchor="middle" class="heading">Layer 2 · GitHub Actions artifacts</text>
  <text x="812" y="358" text-anchor="middle" class="body">selection receipts · executed-test results · diagnostics</text>
  <text x="812" y="380" text-anchor="middle" class="small">content-addressed while retained; unselected = unobserved</text>
  <text x="812" y="402" text-anchor="middle" class="small">bulky data expires and is not canonical authority</text>

  <rect x="615" y="463" width="395" height="220" class="authority" />
  <text x="812" y="493" text-anchor="middle" class="heading">Layer 3 · canonical metrics and authority</text>
  <text x="812" y="518" text-anchor="middle" class="label">refs/heads/aitm/tia-data</text>
  <text x="642" y="551" class="body">• compact canonical snapshot + digest</text>
  <text x="642" y="577" class="body">• active model + validation receipt</text>
  <text x="642" y="603" class="body">• latest sanity and health decisions</text>
  <text x="642" y="629" class="body">• repair lease + provenance</text>
  <text x="642" y="655" class="small">single-parent history · never merged into trunk</text>

  <rect x="615" y="724" width="395" height="116" class="box" />
  <text x="812" y="752" text-anchor="middle" class="heading">Typed repository publisher</text>
  <text x="812" y="777" text-anchor="middle" class="body">job-scoped GITHUB_TOKEN · schema + digest checks</text>
  <text x="812" y="799" text-anchor="middle" class="small">candidate ref → validated status → fast-forward</text>
  <text x="812" y="821" text-anchor="middle" class="small">serialized writes · bounded retry · cooperative fallback</text>

  <path d="M615 215 L555 215 L555 590 L525 590" class="flow-blue" />
  <path d="M525 630 L575 630 L575 364 L615 364" class="flow-blue" />
  <path d="M525 770 L585 770 L585 364 L615 364" class="flow-blue" />
  <path d="M812 724 L812 683" class="flow" />
  <path d="M780 463 L780 443 L555 443 L555 638 L502 638" class="flow-purple dash" />

  <rect x="1070" y="105" width="485" height="815" class="group" />
  <text x="1095" y="138" class="section">3 · PROJECT HEALTH AND REPAIR</text>

  <rect x="1100" y="165" width="425" height="96" class="green" />
  <text x="1312" y="193" text-anchor="middle" class="heading">Scheduled complete CI on exact trunk SHA</text>
  <text x="1312" y="218" text-anchor="middle" class="body">sole health and model activation event</text>
  <text x="1312" y="240" text-anchor="middle" class="small">nightly default · explicit immediate run after repair merge</text>

  <rect x="1100" y="301" width="425" height="112" class="health" />
  <text x="1312" y="329" text-anchor="middle" class="heading">Health state machine</text>
  <text x="1312" y="355" text-anchor="middle" class="body">BOOTSTRAPPING · GREEN · RED · UNKNOWN</text>
  <text x="1312" y="379" text-anchor="middle" class="small">failed, stale, missing, or unverifiable evidence fails closed</text>
  <text x="1312" y="398" text-anchor="middle" class="small">repair merge alone never publishes GREEN</text>

  <rect x="1100" y="453" width="425" height="104" class="authority" />
  <text x="1312" y="481" text-anchor="middle" class="heading">Persistent project-health issue</text>
  <text x="1312" y="506" text-anchor="middle" class="body">authoritative cross-agent work-admission pointer</text>
  <text x="1312" y="529" text-anchor="middle" class="small">exact source SHA + tia-data SHA + remediation issue</text>

  <rect x="1100" y="597" width="200" height="108" class="green" />
  <text x="1200" y="626" text-anchor="middle" class="heading">GREEN</text>
  <text x="1200" y="651" text-anchor="middle" class="body">ordinary AITM work</text>
  <text x="1200" y="672" text-anchor="middle" class="body">affected PR validation</text>
  <text x="1200" y="693" text-anchor="middle" class="small">release remains complete</text>

  <rect x="1325" y="597" width="200" height="108" class="health" />
  <text x="1425" y="626" text-anchor="middle" class="heading">RED / UNKNOWN</text>
  <text x="1425" y="651" text-anchor="middle" class="body">block unrelated work</text>
  <text x="1425" y="672" text-anchor="middle" class="body">fail cheap PR admission</text>
  <text x="1425" y="693" text-anchor="middle" class="small">diagnosis + repair only</text>

  <rect x="1100" y="755" width="425" height="100" class="health" />
  <text x="1312" y="783" text-anchor="middle" class="heading">Serialized repair lease</text>
  <text x="1312" y="808" text-anchor="middle" class="body">holder + governed defect + branch + nonce + TTL</text>
  <text x="1312" y="831" text-anchor="middle" class="small">only matching build-fix PR runs complete validation</text>

  <path d="M1312 261 L1312 301" class="flow" />
  <path d="M1312 413 L1312 453" class="flow-red" />
  <path d="M1248 557 L1200 597" class="flow-green" />
  <path d="M1376 557 L1425 597" class="flow-red" />
  <path d="M1425 705 L1425 730 L1312 730 L1312 755" class="flow-red" />
  <path d="M1100 805 L1060 805 L1060 213 L1100 213" class="flow-green dash" />

  <path d="M1010 575 L1050 575 L1050 357 L1100 357" class="flow-red" />
  <text x="1018" y="558" class="small" fill="#b91c1c">health decision evidence</text>
  <path d="M1100 213 L1030 213 L1030 782 L1010 782" class="flow-blue" />

  <rect x="45" y="950" width="1510" height="88" class="core" />
  <text x="75" y="982" class="heading">Normal AITM setup is the only required installation path</text>
  <text x="75" y="1010" class="body">npm install @kburson/ai-task-manager  →  npx ai-task-manager install  →  npx ai-task-manager init</text>
  <text x="1030" y="982" class="label">No RDBMS · no sister repo · no PAT · no custom App</text>
  <text x="1030" y="1010" class="small">capability-aware ruleset setup and declared cooperative fallback</text>

  <line x1="60" y1="1060" x2="90" y2="1060" stroke="#0369a1" stroke-width="3" />
  <text x="98" y="1064" class="small">observed evidence</text>
  <line x1="240" y1="1060" x2="270" y2="1060" stroke="#7e22ce" stroke-width="3" stroke-dasharray="7 5" />
  <text x="278" y="1064" class="small">inferred, additive signal</text>
  <line x1="470" y1="1060" x2="500" y2="1060" stroke="#b91c1c" stroke-width="3" />
  <text x="508" y="1064" class="small">blocking authority</text>
  <line x1="660" y1="1060" x2="690" y2="1060" stroke="#047857" stroke-width="3" />
  <text x="698" y="1064" class="small">admitted or recovery flow</text>
</svg>
