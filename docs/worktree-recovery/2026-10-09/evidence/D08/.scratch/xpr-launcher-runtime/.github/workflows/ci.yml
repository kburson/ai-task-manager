name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      live_claude:
        description: Run the optional disposable Claude permission conformance probe
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  node-24:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:mcp
      - run: npm run test:packaging
      - run: npm run test:smoke
      - run: npm pack --dry-run

  preferred-node:
    name: Node ${{ matrix.node }} / Ubuntu
    strategy:
      fail-fast: false
      matrix:
        node: ['26', 'current']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:mcp
      - run: npm run test:packaging
      - run: npm run test:smoke
      - run: npm pack --dry-run

  npm-pack-compatibility:
    name: npm ${{ matrix.npm }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24
            npm: '11.8.0'
          - node: 26
            npm: '12.0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global "npm@${{ matrix.npm }}"
      - run: test "$(npm --version)" = "${{ matrix.npm }}"
      - run: npm ci
      - run: npm run test:packaging
      - run: npm run test:smoke

  phase-2-boundary:
    name: Phase 2 boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/verify-extraction.mjs --require-legacy-removed
      - run: npm ls --omit=dev --json
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:mcp
      - run: npm run test:packaging
      - run: npm run test:smoke
      - run: npm pack --dry-run

  live-provider-optional:
    name: Optional live-provider probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_claude == true }}
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_LIVE_MODEL: ${{ vars.CLAUDE_LIVE_MODEL }}
      CLAUDE_LIVE_EFFORT: high
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require the explicit live-provider secret
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: exit 1
      - name: Install the optional Claude runtime
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: npm install --global @anthropic-ai/claude-code
      - name: Run disposable live permission conformance
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: >-
          node test/live/claude-live-conformance.mjs
          --output "${{ runner.temp }}/claude-conformance/sanitized-result.json"
      - name: Upload sanitized conformance evidence
        if: ${{ always() && env.ANTHROPIC_API_KEY != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: claude-live-conformance-sanitized
          path: ${{ runner.temp }}/claude-conformance/sanitized-result.json
          if-no-files-found: error
