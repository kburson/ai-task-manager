name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: node scripts/verify-extraction.mjs --require-legacy-removed
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:packaging
      - run: npm run test:smoke
      - name: Verify immutable signed tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git -c gpg.ssh.allowedSignersFile=provenance/allowed-signers verify-tag "$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)"
      - name: Pack release artifact
        run: |
          npm pack
          shasum -a 256 ai-peer-review-*.tgz > SHA256SUMS
      - name: Publish or verify matching npm artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="ai-peer-review@$(node -p "require('./package.json').version")"
          if tarball_url="$(npm view "$package" dist.tarball 2>/dev/null)"; then
            curl --fail --location --silent --show-error "$tarball_url" --output registry.tgz
            test "$(shasum -a 256 registry.tgz | cut -d ' ' -f 1)" = "$(cut -d ' ' -f 1 SHA256SUMS)"
          else
            npm publish ai-peer-review-*.tgz --access public --provenance
          fi
      - name: Create or verify matching immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir observed-release
            gh release download "$RELEASE_TAG" --dir observed-release --pattern 'ai-peer-review-*.tgz' --pattern SHA256SUMS
            cmp ai-peer-review-*.tgz observed-release/ai-peer-review-*.tgz
            cmp SHA256SUMS observed-release/SHA256SUMS
          else
            gh release create "$RELEASE_TAG" ai-peer-review-*.tgz SHA256SUMS --verify-tag --generate-notes
          fi
